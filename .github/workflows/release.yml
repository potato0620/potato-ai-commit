name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  verify-publishing-identity:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get Marketplace identity ID (no publishing)
        run: |
          identity_id=$(az rest \
            --url https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --query id --output tsv)
          if [ -z "$identity_id" ]; then
            echo "::error::未获取到 Marketplace 身份 ID"
            exit 1
          fi
          echo "Marketplace identity ID: $identity_id"
          echo "Marketplace identity ID: $identity_id" >> "$GITHUB_STEP_SUMMARY"
          echo "请将此 ID 添加为 potato0620 发布者的 Contributor 成员。此任务不会发布扩展。" >> "$GITHUB_STEP_SUMMARY"

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: marketplace
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate extension
        run: |
          pnpm exec tsc --noEmit
          pnpm test

      - name: Sync version from tag
        env:
          VERSION: ${{ github.ref_name }}
        run: npm version "${VERSION#v}" --no-git-tag-version --allow-same-version

      - run: pnpm vsix

      - name: Save VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: potato-ai-commit-${{ github.ref_name }}
          path: '*.vsix'
          if-no-files-found: error

      - name: Check publishing configuration
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::请在 GitHub marketplace 环境中配置变量 $name"
              exit 1
            fi
          done

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Publish to Marketplace
        run: pnpm exec vsce publish --azure-credential --packagePath *.vsix --skip-duplicate

      - name: Generate Changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -n "$PREV_TAG" ]; then
            RANGE_ARG="$PREV_TAG..HEAD"
            echo "范围: $RANGE_ARG"
          else
            RANGE_ARG=""
            echo "无上一个 tag，使用全部提交记录"
          fi

          # 按类型分组汇总
          { echo "## 更新日志"; echo ""

            # feat
            FEAT=$(git log ${RANGE_ARG:+$RANGE_ARG} --no-merges --format='- %s' --grep='^feat' 2>/dev/null || true)
            if [ -n "$FEAT" ]; then echo "### ✨ 新功能"; echo "$FEAT"; echo ""; fi

            # fix
            FIX=$(git log ${RANGE_ARG:+$RANGE_ARG} --no-merges --format='- %s' --grep='^fix' 2>/dev/null || true)
            if [ -n "$FIX" ]; then echo "### 🐛 修复"; echo "$FIX"; echo ""; fi

            # docs
            DOCS=$(git log ${RANGE_ARG:+$RANGE_ARG} --no-merges --format='- %s' --grep='^docs' 2>/dev/null || true)
            if [ -n "$DOCS" ]; then echo "### 📝 文档"; echo "$DOCS"; echo ""; fi

            # style
            STYLE=$(git log ${RANGE_ARG:+$RANGE_ARG} --no-merges --format='- %s' --grep='^style' 2>/dev/null || true)
            if [ -n "$STYLE" ]; then echo "### 💄 样式"; echo "$STYLE"; echo ""; fi

            # refactor
            REFACTOR=$(git log ${RANGE_ARG:+$RANGE_ARG} --no-merges --format='- %s' --grep='^refactor' 2>/dev/null || true)
            if [ -n "$REFACTOR" ]; then echo "### ♻️ 重构"; echo "$REFACTOR"; echo ""; fi

            # perf
            PERF=$(git log ${RANGE_ARG:+$RANGE_ARG} --no-merges --format='- %s' --grep='^perf' 2>/dev/null || true)
            if [ -n "$PERF" ]; then echo "### ⚡ 性能"; echo "$PERF"; echo ""; fi

            # test
            TEST=$(git log ${RANGE_ARG:+$RANGE_ARG} --no-merges --format='- %s' --grep='^test' 2>/dev/null || true)
            if [ -n "$TEST" ]; then echo "### ✅ 测试"; echo "$TEST"; echo ""; fi

            # build / ci
            CI=$(git log ${RANGE_ARG:+$RANGE_ARG} --no-merges --format='- %s' --grep='^\(build\|ci\)' 2>/dev/null || true)
            if [ -n "$CI" ]; then echo "### 📦 构建/CI"; echo "$CI"; echo ""; fi

            # chore
            CHORE=$(git log ${RANGE_ARG:+$RANGE_ARG} --no-merges --format='- %s' --grep='^chore' 2>/dev/null || true)
            if [ -n "$CHORE" ]; then echo "### 🔧 其他"; echo "$CHORE"; echo ""; fi

            # 未匹配的提交
            OTHER=$(git log ${RANGE_ARG:+$RANGE_ARG} --no-merges --format='- %s' \
              --invert-grep --grep='^\(feat\|fix\|docs\|style\|refactor\|perf\|test\|build\|ci\|chore\)' 2>/dev/null || true)
            if [ -n "$OTHER" ]; then echo "### 其他"; echo "$OTHER"; echo ""; fi
          } > CHANGELOG.md

          cat CHANGELOG.md

          # 写入多行输出到 GITHUB_OUTPUT
          {
            echo "body<<EOF"
            cat CHANGELOG.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.vsix'
          body: ${{ steps.changelog.outputs.body }}
